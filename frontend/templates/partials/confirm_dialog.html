<dialog id="aaConfirmDialog" class="modal">
    <div class="modal-box max-w-sm">
        <h3 id="aaConfirmTitle" class="font-bold text-base"></h3>
        <p id="aaConfirmMessage" class="py-4 text-sm text-base-content/80 leading-relaxed"></p>
        <div class="modal-action mt-0">
            <button id="aaConfirmCancel" class="btn btn-ghost btn-sm">Cancel</button>
            <button id="aaConfirmOk" class="btn btn-error btn-sm">Confirm</button>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button>close</button>
    </form>
</dialog>
